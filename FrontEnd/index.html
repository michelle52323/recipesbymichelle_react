<!doctype html>
<html lang="en">

<head>
    <script>
        try {
            const raw = localStorage.getItem("themeCache");
            if (raw) {
                const cache = JSON.parse(raw);
                cache.variables.forEach(v => {
                    document.documentElement.style.setProperty(`--${v.description}`, v.color);
                });
            }
        } catch { }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/app-icons/recipes-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M Recipes</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
